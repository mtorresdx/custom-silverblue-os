---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: custom-silverblue-os
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/silverblue-main
image-version: 42 # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      files:
        - https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo
      copr:
        - atim/starship
        - avengemedia/dms
    install:
      skip-unavailable: true
      packages:
        # Core
        - polkit
        - dbus-daemon
        - dbus-tools
        - dconf
        - gsettings-desktop-schemas
        - gnome-keyring
        # Audio
        - pipewire
        - pipewire-libs-extra
        - wireplumber
        - pulseaudio-utils
        # Network + VPN
        - network-manager-applet
        - NetworkManager-openvpn
        - NetworkManager-openconnect
        - NetworkManager-openvpn-gnome
        - NetworkManager-openconnect-gnome
        ## - Surfshark missing!
        # Bluetooth
        - bluez
        - bluez-tools
        - blueman
        # File System
        - nautilus
        - gvfs-mtp
        - gvfs-gphotos2
        - gvfs-smb
        - gvfs-nfs
        - gvfs-fuse
        - gvfs-archive
        ## Note: Check if you really need gvfs
        # Wayland
        - qt5-wayland
        - qt6-wayland
        - xdg-desktop-portal-gnome
        - xwayland-satellite
        # Media codecs
        - ffmpeg
        - ffmpeg-libs
        - ffmpegthumbnailer
        - gstreamer1-plugins-bad
        - gstreamer1-plugins-ugly
        - libfdk-aac
        - heif-pixbuf-loader
        # Desktop Utils
        - wl-clipboard
        # Containers
        - distrobox
        - podman
        - docker
        # Shell + Terminal apps
        - micro
        - starship
        - fish
        - tmux
        - foot
        # Compositor Stack
        - niri
        - greetd
        - greetd-selinux
        - cosmic-greeter
        - swaync
        - swww
        - gtklock
        - wofi
        - fuzzel
        - dms
        # - noctalia-shell
        ## Do i really need all???
        # Theming + UI polish
        - adw-gtk3-theme
        - nwg-look
        ## Check if this is really what you want (gnome??)
    remove:
      packages:
        # example: removing firefox (in favor of the flatpak)
        # "firefox" is the main package, "firefox-langpacks" is a dependency
        - firefox
        - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)

  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode # don't add spaces or "Nerd Font" suffix
        - Hack
        - SourceCodePro
        - Terminus
        - JetBrainsMono
        - NerdFontsSymbolsOnly
      google-fonts:
        - Roboto
        - Open Sans
        - Inter
        - Lexend

  - type: brew
    brew-analytics: false

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - org.mozilla.firefox
          - org.gnome.Loupe
      - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
